
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | JobShield AI</title>
</head>
<body style="font-family: Arial, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 90vh;">
    <div style="background: #1e293b; padding: 30px; border-radius: 12px; width: 340px;">
        <h1 style="color: #67e8c5;">JobShield AI</h1>
        <h2>Create Account</h2>

        {% if form.errors %}
            <div style="color: #fca5a5; margin-bottom: 15px;">
                Please correct the errors below.
                {{ form.errors }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required
                style="width: 100%; padding: 10px; margin: 8px 0 16px; box-sizing: border-box;">

            <label for="id_password1">Password</label>
            <input type="password" name="password1" id="id_password1" required
                style="width: 100%; padding: 10px; margin: 8px 0 16px; box-sizing: border-box;">

            <label for="id_password2">Confirm Password</label>
            <input type="password" name="password2" id="id_password2" required
                style="width: 100%; padding: 10px; margin: 8px 0 16px; box-sizing: border-box;">

            <button type="submit"
                style="width: 100%; padding: 12px; background: #67e8c5; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
                Register
            </button>
        </form>

        <p>Already have an account? <a href="/login/" style="color: #67e8c5;">Login</a></p>
        <p><a href="/" style="color: #67e8c5;">Back to Home</a></p>
    </div>
</body>
</html>
